# Temporal Email Analysis - Application Configuration

# Dataset paths (relative to project root)
dataset.path=dataset/email-Eu-core-temporal.txt

# Output directories (relative to project root)
output.activity.dir=output/activity
output.rankings.dir=output/rankings
output.components.dir=output/components
output.graphs.dir=output/graphs

# Spark configuration
spark.master=local[*]
spark.app.name=Temporal-Email-Interaction-Analysis

# Number of time windows to split data into
analysis.time.windows=3

# Top N users to display in rankings
analysis.topN=10
